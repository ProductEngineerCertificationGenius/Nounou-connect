<!-- public/offline.html -->
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <meta name="theme-color" content="#F7A82A" />
  <title>Hors ligne - Nounou Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --sable: #FBF3EA;
      --sable-deep: #F3E6D8;
      --argile: #F7A82A;
      --argile-dark: #D98A12;
      --argile-tint: #FDECC8;
      --encre: #3D2B1F;
      --encre-soft: #6B5744;
      --muted: #9C8A76;
      --or-bg: #FBF0DC;
      --line: #E8DCC9;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--sable);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .offline-container {
      background: var(--white);
      border-radius: 32px;
      padding: 48px 32px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(61, 43, 31, 0.08);
      border: 1px solid var(--line);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .offline-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .offline-logo svg {
      flex-shrink: 0;
    }

    .offline-logo span {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--encre);
    }

    .offline-icon-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: conic-gradient(from 180deg, var(--argile-tint), var(--or-bg), var(--sable-deep), var(--argile-tint));
      animation: breathe 4.5s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(247, 168, 42, .18);
      }

      50% {
        box-shadow: 0 0 0 8px rgba(247, 168, 42, 0);
      }
    }

    .offline-icon {
      font-size: 40px;
      display: block;
    }

    .offline-title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--encre);
      margin-bottom: 8px;
    }

    .offline-subtitle {
      color: var(--encre-soft);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .offline-hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--argile);
      color: var(--white);
      border: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-family: 'Public Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      width: 100%;
      box-shadow: 0 6px 16px rgba(247, 168, 42, .3);
    }

    .btn-retry:hover {
      background: var(--argile-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(217, 138, 18, .35);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .offline-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .offline-footer .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--muted);
    }

    @media (max-width: 480px) {
      .offline-container {
        padding: 32px 20px 28px;
        border-radius: 24px;
      }

      .offline-icon-wrap {
        width: 72px;
        height: 72px;
      }

      .offline-icon {
        font-size: 32px;
      }

      .offline-title {
        font-size: 24px;
      }

      .offline-subtitle {
        font-size: 14px;
      }

      .btn-retry {
        padding: 12px 24px;
        font-size: 14px;
      }
    }

    @media (max-width: 380px) {
      .offline-container {
        padding: 24px 16px 20px;
      }

      .offline-icon-wrap {
        width: 60px;
        height: 60px;
      }

      .offline-icon {
        font-size: 26px;
      }

      .offline-title {
        font-size: 20px;
      }

      .offline-logo span {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="offline-container">

    <!-- LOGO : brand-mark identique à la topbar de l'app (carré arrondi, dégradé argile, "N" en Fraunces) -->
    <div class="offline-logo">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="brandGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#F7A82A" />
            <stop offset="1" stop-color="#D98A12" />
          </linearGradient>
        </defs>
        <rect width="40" height="40" rx="11" fill="url(#brandGrad)" />
        <text x="20" y="27" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="19"
          fill="#FFFFFF">N</text>
      </svg>
      <span>Nounou Connect</span>
    </div>

    <!-- ICONE -->
    <div class="offline-icon-wrap">
      <span class="offline-icon">📡</span>
    </div>

    <!-- TEXTE -->
    <h1 class="offline-title">Vous êtes hors ligne</h1>
    <p class="offline-subtitle">
      Reconnectez-vous à Internet pour accéder à toutes les fonctionnalités de Nounou Connect.
    </p>
    <p class="offline-hint">
      💡 Une fois reconnecté, les données seront automatiquement synchronisées.
    </p>

    <!-- BOUTON -->
    <button class="btn-retry" onclick="location.reload()">
      🔄 Réessayer
    </button>

    <!-- FOOTER -->
    <div class="offline-footer">
      <span>🏠</span>
      <span class="dot"></span>
      <span>Nounou Connect</span>
      <span class="dot"></span>
      <span>🌸</span>
    </div>

  </div>
</body>

</html>
