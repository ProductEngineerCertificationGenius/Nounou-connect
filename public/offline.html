<!-- public/offline.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <meta name="theme-color" content="#C2614F" />
  <title>Hors ligne - Nounou Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FAF7F2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .offline-container {
      background: white;
      border-radius: 32px;
      padding: 48px 32px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(28, 25, 23, 0.06);
      border: 1px solid rgba(212, 184, 150, 0.12);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .offline-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .offline-logo svg {
      flex-shrink: 0;
    }

    .offline-logo span {
      font-size: 18px;
      font-weight: 700;
      color: #1C1917;
    }

    .offline-icon {
      font-size: 72px;
      margin-bottom: 16px;
      display: block;
    }

    .offline-title {
      font-family: "'DM Serif Display', serif";
      font-size: 28px;
      font-weight: 700;
      color: #1C1917;
      margin-bottom: 8px;
    }

    .offline-subtitle {
      color: #78716C;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .offline-hint {
      color: #B8A89A;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #C2614F;
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      width: 100%;
    }

    .btn-retry:hover {
      background: #B25545;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(194, 97, 79, 0.25);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .offline-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(212, 184, 150, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #D4B896;
    }

    .offline-footer .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #D4B896;
    }

    @media (max-width: 480px) {
      .offline-container {
        padding: 32px 20px 28px;
        border-radius: 24px;
      }
      .offline-icon {
        font-size: 56px;
      }
      .offline-title {
        font-size: 24px;
      }
      .offline-subtitle {
        font-size: 14px;
      }
      .btn-retry {
        padding: 12px 24px;
        font-size: 14px;
      }
    }

    @media (max-width: 380px) {
      .offline-container {
        padding: 24px 16px 20px;
      }
      .offline-icon {
        font-size: 44px;
      }
      .offline-title {
        font-size: 20px;
      }
      .offline-logo span {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">

    <!-- LOGO -->
    <div class="offline-logo">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="11" fill="#C2614F" />
        <circle cx="13" cy="11" r="4.5" fill="white" />
        <path d="M6 28c0-5 3.5-8.5 7-8.5" stroke="white" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="27" cy="13" r="3.5" fill="rgba(255,255,255,0.7)" />
        <path d="M34 28c0-4 -2.8-6.5-6-7" stroke="rgba(255,255,255,0.7)" stroke-width="2.2" stroke-linecap="round" />
        <path d="M19.5 21.5 C19.5 19.5 17 18 17 20.5 C17 22.5 19.5 24.5 19.5 24.5 C19.5 24.5 22 22.5 22 20.5 C22 18 19.5 19.5 19.5 21.5Z" fill="white" />
      </svg>
      <span>Nounou Connect</span>
    </div>

    <!-- ICONE -->
    <span class="offline-icon">📡</span>

    <!-- TEXTE -->
    <h1 class="offline-title">Vous êtes hors ligne</h1>
    <p class="offline-subtitle">
      Reconnectez-vous à Internet pour accéder à toutes les fonctionnalités de Nounou Connect.
    </p>
    <p class="offline-hint">
      💡 Une fois reconnecté, les données seront automatiquement synchronisées.
    </p>

    <!-- BOUTON -->
    <button class="btn-retry" onclick="location.reload()">
      🔄 Réessayer
    </button>

    <!-- FOOTER -->
    <div class="offline-footer">
      <span>🏠</span>
      <span class="dot"></span>
      <span>Nounou Connect</span>
      <span class="dot"></span>
      <span>🌸</span>
    </div>

  </div>
</body>
</html>
